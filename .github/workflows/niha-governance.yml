name: niha Governance

on:
  pull_request:
    branches: [main]

jobs:
  governance:
    name: Governance Check
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NIHA_API_KEY: ${{ secrets.NIHA_API_KEY }}
      NIHA_WORKSPACE_ID: ${{ vars.NIHA_WORKSPACE_ID }}
      NIHA_PLATFORM_API_URL: ${{ vars.NIHA_PLATFORM_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install niha CLI via Homebrew
        run: |
          brew install --cask niha-and-co/tap/niha || true
          which niha || npm install -g @niha-and-co/niha || echo "CLI install attempted"
          niha --version || echo "niha version check"

      - name: Run niha governance check
        run: |
          echo "API URL: $NIHA_PLATFORM_API_URL"
          echo "Workspace: $NIHA_WORKSPACE_ID"
          niha check \
            --workspace-id "$NIHA_WORKSPACE_ID" \
            --ci \
            --json 2>&1 | tee /tmp/niha-result.json || true
          cat /tmp/niha-result.json || echo "No result file"

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = {};
            try { result = JSON.parse(fs.readFileSync('/tmp/niha-result.json','utf8')); } catch(e){}
            const score = result.score ?? 'n/a';
            const decision = result.result ?? 'completed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### niha Governance — ${decision}\n\nScore: **${score}**\n\n_niha CI check via ngrok_`
            });
