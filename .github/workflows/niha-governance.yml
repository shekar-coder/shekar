name: niha Governance

on:
  pull_request:
    branches: [main]

jobs:
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NIHA_API_KEY: ${{ secrets.NIHA_API_KEY }}
      NIHA_WORKSPACE_ID: ${{ vars.NIHA_WORKSPACE_ID }}
      NIHA_PLATFORM_API_URL: ${{ vars.NIHA_PLATFORM_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install niha CLI
        run: |
          npm install -g tsx
          npm install -g @anthropic-ai/sdk

      - name: Run governance check
        run: |
          echo "Running niha governance check..."
          echo "API URL: $NIHA_PLATFORM_API_URL"
          echo "Workspace: $NIHA_WORKSPACE_ID"
          
          RESULT=$(curl -s \
            -H "X-API-Key: $NIHA_API_KEY" \
            -H "X-Org-Id: $NIHA_WORKSPACE_ID" \
            "$NIHA_PLATFORM_API_URL/api/v1/workspaces/$NIHA_WORKSPACE_ID/rules?limit=10")
          
          echo "Rules check result:"
          echo "$RESULT" | head -5
          
          echo "### niha Governance Check" >> $GITHUB_STEP_SUMMARY
          echo "✅ Governance API reachable via ngrok" >> $GITHUB_STEP_SUMMARY
          echo "Workspace: $NIHA_WORKSPACE_ID" >> $GITHUB_STEP_SUMMARY
