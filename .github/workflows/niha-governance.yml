name: niha Governance

on:
  pull_request:
    branches: [main]

jobs:
  governance:
    name: Governance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NIHA_API_KEY: ${{ secrets.NIHA_API_KEY }}
      NIHA_WORKSPACE_ID: ${{ vars.NIHA_WORKSPACE_ID }}
      NIHA_PLATFORM_API_URL: ${{ vars.NIHA_PLATFORM_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install niha CLI from source
        run: |
          git clone https://github.com/niha-and-co/ai-platform.git /tmp/niha-platform
          cd /tmp/niha-platform/src/cli-ink
          npm install
          npm run build
          npm link
          niha --version

      - name: Run niha governance check
        run: |
          echo "API URL: $NIHA_PLATFORM_API_URL"
          echo "Workspace: $NIHA_WORKSPACE_ID"
          
          niha check --ci \
            --workspace-id "$NIHA_WORKSPACE_ID" \
            --api-url "$NIHA_PLATFORM_API_URL" \
            --api-key "$NIHA_API_KEY" \
            --json > /tmp/niha-result.json || true

          cat /tmp/niha-result.json

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let result = {};
            try { result = JSON.parse(fs.readFileSync('/tmp/niha-result.json', 'utf8')); } catch(e) {}
            const score = result.score ?? 'n/a';
            const decision = result.result ?? 'unknown';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### niha Governance — ${decision}\n\nScore: **${score}**\n\n_niha CI check_`
            });
